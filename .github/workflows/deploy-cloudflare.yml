name: Deploy to Cloudflare (Pages + Workers)

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy-frontend:
    name: Build and deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (root)
        working-directory: frontend
        run: npm install --no-audit --no-fund --workspaces=false

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          directory: frontend/dist

  deploy-workers:
    name: Deploy backend as Cloudflare Worker (optional)
    runs-on: ubuntu-latest
    needs: build-and-deploy-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Publish Worker
        if: ${{ secrets.CF_API_TOKEN && secrets.CF_ACCOUNT_ID && secrets.CF_WORKER_NAME }}
        run: |
          cd workers
          wrangler publish --name ${{ secrets.CF_WORKER_NAME }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
