name: Deploy to Cloudflare (Pages + Workers)

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy-frontend:
    name: Build and deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (root)
        working-directory: frontend
        run: npm install --no-audit --no-fund --workspaces=false

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy frontend/dist --project-name "$CF_PAGES_PROJECT_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}

  deploy-workers:
    name: Deploy backend as Cloudflare Worker (optional)
    runs-on: ubuntu-latest
    needs: build-and-deploy-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Publish Worker
        if: ${{ secrets.CF_API_TOKEN && secrets.CF_ACCOUNT_ID && secrets.CF_WORKER_NAME }}
        run: |
          cd workers
          wrangler publish --name ${{ secrets.CF_WORKER_NAME }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
