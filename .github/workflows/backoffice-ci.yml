name: Back-office CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
      - name: Lint backend
        run: |
          npm exec --prefix backend eslint . || true
      - name: Lint frontend
        run: |
          npm exec --prefix frontend eslint . || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
      - name: Run backend tests
        run: |
          echo "No backend tests configured yet"
      - name: Run frontend tests
        run: |
          echo "No frontend tests configured yet"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Build backend Docker image
        run: docker build -t backoffice-admin-api ./backoffice-scaffold/backend

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release && wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add - && echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list && sudo apt-get update && sudo apt-get install -y trivy
      - name: Scan backend Docker image
        run: trivy image --severity HIGH,CRITICAL backoffice-admin-api || true

  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging
        run: echo "Deployment to staging should be configured via Railway or manual infra"

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Smoke test staging
        run: |
          echo "Smoke test placeholder"
