services:
  # Backend API (Express) — no build step needed, plain Node.js
  - type: web
    name: app-assata-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm install --no-audit --no-fund
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      # Set these in the Render dashboard (sync: false keeps them secret):
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  # Frontend (Vite) — static site
  - type: web
    name: app-assata-frontend
    runtime: static
    rootDir: .
    buildCommand: cd frontend && npm install --no-audit --no-fund --workspaces=false && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
